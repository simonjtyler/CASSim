[project]
name = "cassim"
version = "0.2.2"
description = "Browser simulation of the TI-Nspire CX CAS (Python/SymPy via Pyodide, UI in Flet)."
authors = [{ name = "Simon Tyler" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "sympy>=1.14",
    "pyyaml>=6",
]

[project.optional-dependencies]
stats = ["scipy>=1.16", "numpy>=2"]
cli = ["prompt-toolkit>=3"]

[project.scripts]
cassim = "cassim.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pre-commit",
    "types-pyyaml",
    "prompt-toolkit>=3",
    "markdown-it-py>=4.2.0",
    "fonttools>=4.69.1",
]
test = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "playwright",
    "pytest-playwright",
    "pillow",
]
web = [
    "flet[all]>=1.0.5",
    "flet-mcp",
    "scipy>=1.16",
    "numpy>=2",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]
extend-exclude = ["references", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "PL", "PT", "RUF", "TID"]
# TI maths symbols, which are the intended characters here.
allowed-confusables = ["α", "ⅈ", "ⅇ", "ᴇ", "σ", "−", "×", "∗", "∨", "–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]
"spikes/**" = ["ANN", "PLR2004", "T20"]
# PLC0415: flet and Pillow are optional groups, so tools import them where used.
"tools/**" = ["PLR2004", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config -m \"not e2e and not slow\""
xfail_strict = true
markers = [
    "corpus: golden-corpus replay cases",
    "slow: seeded simulations of 10^5 to 10^6 passes (20 to 100 s each); run with -m slow",
    "e2e: Playwright end-to-end tests (need a built static site)",
]

[tool.ty.environment]
python-version = "3.14"
root = ["src", "."]

[tool.ty.src]
include = ["src", "tests", "tools"]

[tool.ty.terminal]
# Strict: a warning fails the check, so possibly-unresolved-reference, unused-ignore-comment,
# redundant-cast and deprecated are errors too.
error-on-warning = true

# Per-package coverage floors (NFR-MAINT-004), checked by tools/coverage_check.py. Lines and
# branches combined, in percent. These match the SRS targets: 90 for core and 80 for the other
# non-UI device, doc, graph, sheet and stats packages. `app` and device UI are covered by Playwright.
# Runtime and CLI retain their 90% floors.
[tool.cassim.coverage]
core = 90
device = 80
doc = 80
devices = 80
graph = 80
sheet = 80
stats = 80
runtime = 90
cli = 90
